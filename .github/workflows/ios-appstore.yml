# Application iPhone : fabrication sur un Mac de GitHub, signature automatique et envoi vers App Store Connect (TestFlight).
# Lancement : onglet Actions › « Application iPhone (App Store) » › Run workflow.
# Secrets (Settings › Secrets and variables › Actions › Secrets) :
#   APPLE_API_KEY_P8      contenu complet du fichier AuthKey_XXXXXXXXXX.p8
#   APPLE_API_KEY_ID      Key ID de la clé (10 caractères)
#   APPLE_API_ISSUER_ID   Issuer ID (en haut de la page des clés)
# Variable (onglet Variables) : APPLE_TEAM_ID (Team ID, 10 caractères). Quand Supabase sera prêt : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_WEB_URL.
name: Application iPhone (App Store)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Site intégré à l'application
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Clé App Store Connect
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$P8" -a -n "$KEY_ID" || { echo "::error::Secrets APPLE_API_KEY_P8 / APPLE_API_KEY_ID manquants"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Fabrication et signature (archive)
        working-directory: app/ios/App
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Envoi vers App Store Connect
        working-directory: app/ios/App
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: Nettoyage de la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
